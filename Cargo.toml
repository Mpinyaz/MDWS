[workspace]
members = ["crates/*"]

resolver = "2"

[workspace.dependencies]
mdtrading = { path = "crates/mdtrading" }
mdanalytics = { path = "crates/mdanalytics" }
mdcore = { path = "crates/mdcore" }
mdworkers = { path = "crates/mdworkers" }
rstest = "*"
influxdb = { version = "0.8.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
plotters = "0.3.7"
polars = { version = "0.54.4", features = [
  "lazy",
  "temporal",
  "strings",
  "dtype-datetime",
  "json",
] }
arc-swap = { version = "1.8.2" }
dotenvy = "0.15.7"
serde_json = "^1.0.149"
axum = { version = "0.8.8", features = ["macros"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-error = "0.2.1"
tower-http = { version = "0.7.0", features = ["trace"] }
snowflake_me = { version = "1.0.0", features = ["ip-fallback", "serde"] }
futures-util = "0.3.32"
tokio-stream = { version = "0.1.18", features = ["full"] }
redis = { version = "1.0.4", features = ["tokio-comp", "connection-manager"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
color-eyre = "0.6.5"
reqwest = { version = "0.13.3", features = ["json"] }
rust_decimal = { version = "1.41.0", features = ["serde-float", "maths"] }
serde = { version = "^1.0.228", features = ["derive"] }
chrono = { version = "^0.4.41", features = ["serde"] }
rust_decimal_macros = "1.40.0"
ta = "0.5.0"
dashmap = { version = "6.2.1", features = ["serde"] }
async-trait = "0.1.89"
rabbitmq-stream-client = "0.11.0"
dotenv = "0.15.0"
anyhow = "1.0.100"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
