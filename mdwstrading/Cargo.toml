[package]
name = "mdwstrading"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "^0.4.41", features = ["serde"] }
rust_decimal = { version = "1.40.0", features = ["maths"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
mdcore = { path = "../mdcore" }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "sync"] }
rust_decimal_macros = "1.40.0"
ta = "0.5.0"
reqwest = { version = "0.13.3", features = ["json"] }
dashmap = { version = "6.2.1", features = ["serde"] }
