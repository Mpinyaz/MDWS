[package]
name = "mdworkers"
version = "0.1.0"
authors = ["Elton Mpinyuri <ebmpinyuri@gmail.com>"]
repository = "https://github.com/Mpinyaz/MDWS"
edition = "2024"
description = "Rabbit MQ consumer that streams market data from web sockets"
readme = "./README.md"
keywords = ["rabbitmq", "websockets"]

[[bin]]
name = "server"
path = "src/bin/server.rs"

[lib]
path = "src/lib.rs"

[dependencies]
mdcore.workspace = true
tokio-tungstenite.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde.workspace = true
futures-util.workspace = true
async-trait.workspace = true
rabbitmq-stream-client.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenv.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
influxdb.workspace = true

